name: Build CUBED APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout CUBED
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            unzip \
            wget \
            zip

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.36" virtualenv
          python -m pip install git+https://github.com/kivy/buildozer.git

      - name: Build CUBED APK
        run: |
          yes | buildozer -v android debug

      - name: Upload CUBED APK
        uses: actions/upload-artifact@v4
        with:
          name: CUBED-APK
          path: bin/*.apk
          if-no-files-found: error
